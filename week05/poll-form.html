<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poll</title>
</head>
<body>
    <header></header>
    <main>
        <form>
            <label>Full Name: <input type="text" id="fullname" name="fullname" required></label>
            <label>Email: <input type="email" id="useremail" name="useremail" required></label>
            <label>
                What is your favorite browser?
                <select name="browser">
                    <option value="brave">Brave</option>
                    <option value="firefox">Firefox</option>
                    <option value="safari">Safari</option>
                    <option value="chrome">Google Chrome</option>
                    <option value="edge">Microsoft Edge</option>
                    <option value="explorer">Internet Explorer</option>
                    <option value="other">Other</option>
                </select>
            </label>
            <label>Do you have a household pet?<input type="checkbox" name="pet"></label>
            <label>
                List the places you have lived.
                <textarea
                  name="feedback"
                  rows="5"
                  placeholder="Nauvoo, Salt Lake City, Palmyra"></textarea>
            </label>
            <button type="submit">Submit Poll</button>
        </form>
    </main>
    <footer></footer>
</body>
</html>
