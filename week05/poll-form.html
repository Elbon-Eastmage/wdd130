<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Poll</title>
    <link rel="stylesheet" href="styles/poll-form.css">
</head>
<body>
    <header>
        <h1>WDD 130 | HTML Form - User Poll</h1>
    </header>
    <main>
        <form>
            <fieldset>
                <legend>Contact Information</legend>
                <div class="form-item column2">
                    <label>
                        Full Name:
                        <input type="text" id="fullname" name="fullname" required>
                    </label>
                </div>
                <div class="form-item column2">
                    <label>
                        Email:
                        <input type="email" id="useremail" name="useremail" required>
                    </label>
                </div>
            </fieldset>
            <fieldset>
                <legend>Questions</legend>
                <div class="form-item column1">
                    <label>
                        What is your favorite browser?
                        <select name="browser">
                            <option value="brave">Brave</option>
                            <option value="firefox">Firefox</option>
                            <option value="safari">Safari</option>
                            <option value="chrome">Google Chrome</option>
                            <option value="edge">Microsoft Edge</option>
                            <option value="explorer">Internet Explorer</option>
                            <option value="other">Other</option>
                        </select>
                    </label>
                </div>
                <div class="form-item column1">
                    <label>Do you have a household pet? <input type="checkbox" name="pet"></label>
                </div>
                <div class="form-item">
                    <label>
                        List the places you have lived:
                        <textarea
                          name="feedback"
                          rows="3"
                          placeholder="Nauvoo, Salt Lake City, Palmyra"></textarea>
                    </label>
                </div>
            </fieldset>
            <button type="submit">Submit Poll</button>
        </form>
    </main>
    <footer>
        <p>&copy;2026 | HTML Form - User Poll Activity | Elbert John Eastmond</p>
    </footer>
</body>
</html>
