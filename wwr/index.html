<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      name="description"
      content="Exciting Expeditions is a white water rafting company that offers a variety of experiences.">
    <meta name="author" content="Elbert John Eastmond">
    <title>Exciting Expeditions</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
    <header>
        <img src="images/logo.webp" alt="Exciting Expeditions logo">
        <nav class="map">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <div class="hero">
            <img src="images/sunset.webp" alt="Person on raft viewing sunset">
            <h1 class="headline">Adventure Awaits You</h1>
        </div>
        <div class="page-center">
            <a class="picture-link" href="trips.html">
                <div class="labeled-picture">
                    <img src="images/misty-mountains.webp" alt="On raft near misty mountains">
                    <p>Schedule a trip now!</p>
                </div>
            </a>
            <form class="simple-form">
                <div class="form-heading">Stay in the Loop</div>
                <label>Name: <input type="text" name="user-name" required></label>
                <label>Email: <input type="email" name="user-email" required></label>
                <button class="prime-button" type="submit">Sign up for the newsletter</button>
            </form>
        </div>
        <div class="picture-grid">
            <figure>
                <img src="images/otter.webp" alt="Otter on raft">
                <figcaption>See many different animals on our expeditions!</figcaption>
            </figure>
            <figure>
                <img src="images/waterfall.webp" alt="Giant waterfalls">
                <figcaption>We choose only the best rapids for you.</figcaption>
            </figure>
            <figure>
                <img src="images/campfire.webp" alt="Cooking marshmallows over a campfire">
                <figcaption>
                    We don't just offer white water rafting, but full-fledged camping experiences.
                </figcaption>
            </figure>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 Exciting Expeditions | Elbert John Eastmond</p>
        <nav class="socialmedia">
            <a href="https://www.youtube.com" target="_blank">
                <img src="images/youtube.png" alt="YouTube Logo">
            </a>
            <a href="https://twitter.com" target="_blank">
                <img src="images/twitter.png" alt="Twitter Logo">
            </a>
            <a href="https://www.facebook.com" target="_blank">
                <img src="images/facebook.png" alt="Facebook Logo">
            </a>
        </nav>
    </footer>
</body>
</html>
